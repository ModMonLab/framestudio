name: CI
# One run per change: pull requests, pushes to main, or by hand ("Run workflow"). Doc-only changes skip CI.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
# A new push cancels the run for the commit it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        # Pull requests check Linux; main and manual runs add Windows and macOS.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Export tests encode with ffmpeg (decision 0013).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
        env:
          CI: "true"
  visual:
    # Screenshots are platform-specific; goldens are recorded on Linux Chromium.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @frame/gallery exec playwright install --with-deps chromium
      - run: pnpm test:visual
      - if: failure()
        run: pip install pillow && python3 tools/ci/diff-bbox.py apps/gallery/test-results
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: apps/gallery/test-results/
          retention-days: 7
  voice-worker:
    # CPU-only: fixture engine, API contract and OpenAPI drift (API-04). GPU paths need the reference machine.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/voice-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest -q
  slice:
    # M1 vertical slice against the real Voice Worker API with the fixture engine (API-04; not real speech).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pip install -e 'services/voice-worker[dev]'
      - run: |
          (cd services/voice-worker && python -m frame_worker serve --engine fixture --port 8765 &) 
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/v1/health && break; sleep 1; done
      - run: pnpm vitest run tools/test/slice.test.ts packages/mcp/test/mcp.test.ts
        env:
          FRAME_TEST_WORKER_URL: http://127.0.0.1:8765
      # The same flow driven through the Studio UI against a real Frame Server (preview pixels = export renderer).
      - run: pnpm --filter @frame/studio exec playwright install --with-deps chromium
      - run: pnpm --filter @frame/studio exec playwright test
        env:
          FRAME_TEST_WORKER_URL: http://127.0.0.1:8765
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-e2e
          path: apps/studio/test-results/
          retention-days: 7
