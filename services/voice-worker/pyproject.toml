[project]
name = "frame-voice-worker"
version = "0.1.0"
description = "Frame Voice Worker: self-hosted speech design, cloning, synthesis and alignment (Frame Voice API v1)"
requires-python = ">=3.11"
license = { text = "Proprietary-Owner" }
dependencies = [
  "fastapi==0.120.0",
  "uvicorn[standard]==0.38.0",
  "pydantic==2.14.1",
  "numpy>=2.1,<3",
  "soundfile==0.14.0",
  "httpx==0.28.1",
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
# GPU engines (reference machine: RTX 50-series → CUDA 12.8 wheels; see scripts/setup-wsl.sh).
gpu = [
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "qwen-tts==0.1.1",
  "transformers==4.57.3",
  "accelerate==1.12.0",
  "whisperx==3.8.6",
  "g2p-en==2.1.0",
]
dev = ["pytest==8.4.2", "pyyaml==6.0.3"]

[project.scripts]
frame-voice-worker = "frame_worker.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["frame_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
