components:
  schemas:
    AlignRequest:
      properties:
        audioHash:
          title: Audiohash
          type: string
        language:
          default: en
          title: Language
          type: string
        transcript:
          minLength: 1
          title: Transcript
          type: string
      required:
      - audioHash
      - transcript
      title: AlignRequest
      type: object
    BenchmarkRequest:
      properties:
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
      title: BenchmarkRequest
      type: object
    Body_put_blob_v1_blobs_post:
      properties:
        file:
          format: binary
          title: File
          type: string
      required:
      - file
      title: Body_put_blob_v1_blobs_post
      type: object
    DeliveryIn:
      properties:
        emotion:
          anyOf:
          - type: string
          - type: 'null'
          title: Emotion
        instruction:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Instruction
        pace:
          anyOf:
          - maximum: 2.0
            minimum: 0.5
            type: number
          - type: 'null'
          title: Pace
      title: DeliveryIn
      type: object
    DesignRequest:
      properties:
        candidates:
          default: 4
          maximum: 8.0
          minimum: 1.0
          title: Candidates
          type: integer
        description:
          maxLength: 2000
          minLength: 3
          title: Description
          type: string
        language:
          default: en
          title: Language
          type: string
        sampleText:
          maxLength: 2000
          minLength: 1
          title: Sampletext
          type: string
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
      required:
      - description
      - sampleText
      title: DesignRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    PrepareRequest:
      properties:
        engine:
          anyOf:
          - type: string
          - type: 'null'
          title: Engine
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        refs:
          items:
            $ref: '#/components/schemas/RefIn'
          minItems: 1
          title: Refs
          type: array
      required:
      - refs
      title: PrepareRequest
      type: object
    RangeRequest:
      properties:
        description:
          title: Description
          type: string
        emotions:
          items:
            type: string
          maxItems: 16
          minItems: 1
          title: Emotions
          type: array
        language:
          default: en
          title: Language
          type: string
        neutralRef:
          $ref: '#/components/schemas/RefIn'
        text:
          maxLength: 2000
          minLength: 1
          title: Text
          type: string
      required:
      - neutralRef
      - description
      - emotions
      - text
      title: RangeRequest
      type: object
    RefIn:
      properties:
        emotion:
          default: neutral
          title: Emotion
          type: string
        hash:
          title: Hash
          type: string
        transcript:
          default: ''
          title: Transcript
          type: string
      required:
      - hash
      title: RefIn
      type: object
    SynthRequest:
      properties:
        delivery:
          $ref: '#/components/schemas/DeliveryIn'
          default: {}
        format:
          default: wav
          enum:
          - wav
          - flac
          title: Format
          type: string
        language:
          default: en
          title: Language
          type: string
        sampleRate:
          default: 48000
          maximum: 96000.0
          minimum: 8000.0
          title: Samplerate
          type: integer
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
        takes:
          default: 1
          maximum: 8.0
          minimum: 1.0
          title: Takes
          type: integer
        text:
          minLength: 1
          title: Text
          type: string
        voice:
          $ref: '#/components/schemas/VoiceIn'
      required:
      - text
      - voice
      title: SynthRequest
      type: object
    TranscribeRequest:
      properties:
        audioHash:
          title: Audiohash
          type: string
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
      required:
      - audioHash
      title: TranscribeRequest
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    VoiceIn:
      properties:
        conditioningHash:
          anyOf:
          - type: string
          - type: 'null'
          title: Conditioninghash
        refs:
          items:
            $ref: '#/components/schemas/RefIn'
          minItems: 1
          title: Refs
          type: array
      required:
      - refs
      title: VoiceIn
      type: object
info:
  description: 'Frame Voice API v1 — contract between Frame and the self-hosted Voice Worker (SRS §5). Long operations return
    a job ({id, state, progress, queuePosition, result?, error?}); poll GET /v1/jobs/{id} or subscribe to the /v1/events WebSocket.
    Errors use {error: {code, message, details}} with codes UNAUTHORIZED, NOT_FOUND, UNSUPPORTED_CONTROL, TEXT_TOO_LONG, REFERENCE_TOO_SHORT,
    LANGUAGE_UNSUPPORTED, MODEL_NOT_INSTALLED, OUT_OF_MEMORY, BUSY, CANCELLED, ENGINE_ERROR, INVALID_AUDIO. Send an Idempotency-Key
    header to make retries safe. When the worker is bound to a network address every request except /v1/health needs ''Authorization:
    Bearer <token>''.'
  title: Frame Voice API
  version: '1.0'
openapi: 3.1.0
paths:
  /v1/align:
    post:
      operationId: align_v1_align_post
      parameters:
      - in: header
        name: idempotency-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlignRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Align
  /v1/benchmark:
